<!DOCTYPE html>
<html>
<!-- Status and operation remain authoritative on the server. -->

<head>

    <style>
        .debug-outline *, .debug-outline *::before, .debug-outline *::after {
            outline: 1px solid red;
        }
        .debug-outline .container_anwesenheit { outline-color: yellow; }
        .image-wrapper:focus-visible {
            outline: 3px solid currentColor;
            outline-offset: 2px;
        }

        html {
            background-color: var(--hintergrundfarbe);
            overflow: hidden;
        }

        body:before {
            content: '';
            display: flex;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-repeat: no-repeat;
            background-size: cover;
            opacity: var(--bildtransparenz);
            background: var(--background-image, none) center / cover no-repeat;
        }

        body {
            justify-content: center;
            display: flex;
        }

        .hidden {
            display: none !important;
        }

        .container_anwesenheit {
            width: 100%;
            display: grid;
            /* Kleine Kacheln umbrechen lassen; Text darf die Spalten nicht verbreitern. */
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 10px;
            justify-items: center;
            /* Icon in der Zelle zentrieren */
            align-items: start; 
            align-content: center;
            padding-top: 0px;
            padding-bottom: 0px;
        }

        .bewohner_div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-width: 0;
            gap: 5px; /* Abstand zwischen Bild-Wrapper und Text */
        }

        .image-wrapper {
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            border-radius: var(--corner-radius, 50%);
            display: flex;
            align-items: center; /* Vertikale Zentrierung des Kind-Elements (img) */
            justify-content: center; /* Horizontale Zentrierung des Kind-Elements (img) */
            width: 100%; /* Nimmt volle Breite der Grid-Spalte */
            max-width: var(--image-max-width, 80%); /* Maximale Größe des Bildkreises, anpassbar über die Konfiguration */
            aspect-ratio: 1 / 1; /* Behält ein quadratisches Seitenverhältnis bei */
            margin-left: auto; /* Zentriert den Wrapper horizontal */
            margin-right: auto;
            overflow: hidden; /* Verhindert, dass übergroße Inhalte vor object-fit sichtbar sind */
        }

        .image-wrapper:disabled { cursor: default; }

        .name {
            text-align: center;
            font-size: var(--name-font-size, 10px);
            width: 100%; /* Stellt sicher, dass die Zentrierung über die volle Breite erfolgt */
            line-height: 1.2;
            /* word-break: break-word; removed as nowrap is used for ellipsis */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info {
            text-align: center;
            font-size: var(--info-font-size, 8px);
            opacity: 0.5;
            width: 100%; /* Stellt sicher, dass die Zentrierung über die volle Breite erfolgt */
            line-height: 1.2;
            /* word-break: break-word; removed as nowrap is used for ellipsis */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Gemeinsame Stile für .color und .grey */
        .color,
        .grey {
            max-width: 100%; /* Stellt sicher, dass das Bild nicht breiter als der Wrapper ist */
            max-height: 100%; /* Stellt sicher, dass das Bild nicht höher als der Wrapper ist */
            object-fit: contain; /* Zeigt das gesamte Bild, behält Seitenverhältnis bei und zentriert es innerhalb seiner Box */
            border-radius: var(--corner-radius, 50%);
        }

        .color {
            filter: grayscale(0%);
        }

        .grey {
            filter: grayscale(100%);
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <script>
        function handleMessage(data) {
            let update;
            try {
                update = JSON.parse(data);
            } catch (error) {
                console.warn('Invalid resident tile update', error);
                return;
            }
            if (!update || typeof update !== 'object' || Array.isArray(update)) return;
            const root = document.documentElement;
            const variables = {
                fontsize: ['--name-font-size', 'px'],
                infontsize: ['--info-font-size', 'px'],
                eckenradius: ['--corner-radius', '%'],
                imageMaxWidth: ['--image-max-width', '%'],
                bildtransparenz: ['--bildtransparenz', ''],
                kachelhintergrundfarbe: ['--hintergrundfarbe', '']
            };
            for (const [key, [property, unit]] of Object.entries(variables)) {
                if (Object.prototype.hasOwnProperty.call(update, key)) root.style.setProperty(property, update[key] + unit);
            }
            if (Object.prototype.hasOwnProperty.call(update, 'bgimage')) {
                document.body.style.setProperty('--background-image', update.bgimage ? 'url(' + update.bgimage + ')' : 'none');
            }
            if (Object.prototype.hasOwnProperty.call(update, 'DebugOutline')) root.classList.toggle('debug-outline', !!update.DebugOutline);
            for (let i = 1; i <= 5; i++) {
                const resident = document.getElementById('Bewohner' + i);
                const name = document.getElementById('name' + i);
                const info = document.getElementById('info' + i);
                const image = document.getElementById('image' + i);
                const button = document.getElementById('button' + i);
                if (Object.prototype.hasOwnProperty.call(update, 'Bewohner' + i)) resident.classList.toggle('hidden', !update['Bewohner' + i]);
                if (Object.prototype.hasOwnProperty.call(update, 'nameswitch')) name.classList.toggle('hidden', !update.nameswitch);
                if (Object.prototype.hasOwnProperty.call(update, 'name' + i)) {
                    name.textContent = update['name' + i];
                    button.setAttribute('aria-label', update['name' + i]);
                }
                if (Object.prototype.hasOwnProperty.call(update, 'info' + i)) {
                    info.textContent = update['info' + i];
                    info.classList.toggle('hidden', update['info' + i] === '');
                }
                if (Object.prototype.hasOwnProperty.call(update, 'image' + i)) {
                    if (update['image' + i]) image.src = update['image' + i];
                    else image.removeAttribute('src');
                }
                if (Object.prototype.hasOwnProperty.call(update, 'value' + i)) {
                    const present = !!update['value' + i];
                    image.classList.toggle('color', present);
                    image.classList.toggle('grey', !present);
                    button.setAttribute('aria-pressed', String(present));
                }
                if (Object.prototype.hasOwnProperty.call(update, 'operable' + i)) button.disabled = !update['operable' + i];
            }
        }
    </script>


    <div class="container_anwesenheit" id="container">
        <div class="bewohner_div hidden" id="Bewohner1">
            <button type="button" class="image-wrapper" id="button1" disabled aria-pressed="false" aria-describedby="info1" onclick="requestAction('Bewohner1', 1);">
                <img class="color" id="image1" alt="">
            </button>
            <div class="name hidden" id="name1"></div>
            <div class="info hidden" id="info1"></div>
        </div>

        <div class="bewohner_div hidden" id="Bewohner2">
            <button type="button" class="image-wrapper" id="button2" disabled aria-pressed="false" aria-describedby="info2" onclick="requestAction('Bewohner2', 1);">
                <img class="color" id="image2" alt="">
            </button>
            <div class="name hidden" id="name2"></div>
            <div class="info hidden" id="info2"></div>
        </div>

        <div class="bewohner_div hidden" id="Bewohner3">
            <button type="button" class="image-wrapper" id="button3" disabled aria-pressed="false" aria-describedby="info3" onclick="requestAction('Bewohner3', 1);">
                <img class="color" id="image3" alt="">
            </button>
            <div class="name hidden" id="name3"></div>

        </div>

        <div class="bewohner_div hidden" id="Bewohner4">
            <button type="button" class="image-wrapper" id="button4" disabled aria-pressed="false" aria-describedby="info4" onclick="requestAction('Bewohner4', 1);">
                <img class="color" id="image4" alt="">
            </button>

        <div class="bewohner_div hidden" id="Bewohner5">
            <button type="button" class="image-wrapper" id="button5" disabled aria-pressed="false" aria-describedby="info5" onclick="requestAction('Bewohner5', 1);">
                <img class="color" id="image5" alt="">
            </button>
            <div class="name hidden" id="name5"></div>

        </div>
    </div>

</body>

</html>
