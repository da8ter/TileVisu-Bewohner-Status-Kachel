<!DOCTYPE html>
<html>
<!-- Status and operation remain authoritative on the server. -->

<head>

    <style>
        .image-wrapper:focus-visible {
            outline: 3px solid currentColor;
            outline-offset: 2px;
        }

        :root {
            /* Von Symcon in der Kachel-Adresse uebergeben; 0 solange sie fehlen.
               Der untere Rand bleibt aussen vor, unten steht nichts an. */
            --sym-mt: 0px;
            --sym-ms: 0px;
            /* Grenzen fuer das Kennzeichen. Es waechst mit dem Foto, bleibt
               aber in diesem Rahmen lesbar und dezent. */
            --badge-min: 7px;
            --badge-max: 13px;
        }

        html {
            background-color: var(--hintergrundfarbe);
            overflow: hidden;
        }

        body:before {
            content: '';
            display: flex;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-repeat: no-repeat;
            background-size: cover;
            opacity: var(--bildtransparenz);
            background: var(--background-image, none) center / cover no-repeat;
        }

        body {
            justify-content: center;
            display: flex;
            /* Die Raender kommen vom System und liegen am Raster, nicht am Body. */
            margin: 0;
        }

        .hidden {
            display: none !important;
        }

        .container_anwesenheit {
            width: 100%;
            display: grid;
            /* Kleine Kacheln umbrechen lassen; Text darf die Spalten nicht verbreitern. */
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 10px;
            justify-items: center;
            /* Icon in der Zelle zentrieren */
            align-items: start; 
            align-content: center;
            /* Die Kachel setzt ihre Raender selbst: die Systemwerte aus der
               Adresse (margintop/marginside/marginbottom) wuerden hier doppelt
               wirken, weil die Bewohnerreihe ohnehin zentriert ist und die
               Bildbreite ueber ImageMaxWidth begrenzt wird.
               Oben und seitlich gilt der Wert aus der Kachel-Adresse. Das
               Kennzeichen darf in den oberen Rand hineinragen; nur wenn der
               kleiner ist als sein Ueberstand, wird auf eine halbe
               Kennzeichenhoehe aufgefuellt — sonst schneidet das
               overflow: hidden am html-Element es in der obersten Reihe ab. */
            padding: max(var(--sym-mt), calc(var(--badge-max) * 0.95)) var(--sym-ms) 0 var(--sym-ms);
        }

        .bewohner_div {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-width: 0;
            gap: 5px; /* Abstand zwischen Bild-Wrapper und Text */
        }

        /* Traegt Groesse und Zentrierung des Fotos und ist der Bezugspunkt fuer
           das Entfernungs-Kennzeichen. Noetig, weil der Button selbst mit
           overflow: hidden schneidet und das Kennzeichen ueber den Rand ragt. */
        .photo {
            position: relative;
            /* Bezugsgroesse fuer das Kennzeichen: 1cqw = 1 % der Fotobreite. */
            container-type: size;
            width: 100%; /* Nimmt volle Breite der Grid-Spalte */
            max-width: var(--image-max-width, 80%); /* Maximale Größe des Bildkreises, anpassbar über die Konfiguration */
            aspect-ratio: 1 / 1; /* Behält ein quadratisches Seitenverhältnis bei */
            margin-left: auto; /* Zentriert das Foto horizontal */
            margin-right: auto;
        }

        .image-wrapper {
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            border-radius: var(--corner-radius, 50%);
            display: flex;
            align-items: center; /* Vertikale Zentrierung des Kind-Elements (img) */
            justify-content: center; /* Horizontale Zentrierung des Kind-Elements (img) */
            width: 100%;
            height: 100%;
            overflow: hidden; /* Verhindert, dass übergroße Inhalte vor object-fit sichtbar sind */
        }

        /* Entfernung, oben rechts am Foto. */
        .badge {
            position: absolute;
            /* In der Bildecke, aber innerhalb des Fotorahmens: html steht auf
               overflow: hidden, ein herausragendes Kennzeichen waere in der
               obersten Reihe abgeschnitten. */
            top: 0;
            right: 0;
            /* Eine halbe Hoehe nach oben aus dem Foto heraus. */
            transform: translateY(-50%);
            max-width: 100%;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            /* Eingeklappt ein Kreis: feste Hoehe und dieselbe Mindestbreite. Ohne
               das richtet sich die Hoehe nach der Zeilenhoehe des Textelements
               (das auch eingeklappt im Baum steht) und die Breite nach Symbol
               plus Polsterung — die beiden treffen sich nie. */
            height: 1.9em;
            min-width: 1.9em;
            padding: 0 0.45em;
            border-radius: 999px;
            border: 0;
            outline: 0;
            box-shadow: none;
            text-shadow: none;
            /* Symcon liefert die Akzentfarbe als --accent-color; der Rueckfall
               gilt nur ausserhalb der Visu. Weisse Schrift wie bei den uebrigen
               Kacheln: die Flaeche ist immer der Akzent, unabhaengig vom Thema. */
            background: var(--accent-color, #00cdab);
            color: #fff;
            /* Waechst mit dem Foto, gedeckelt durch die Grenzen oben. */
            font-size: clamp(var(--badge-min), 10cqw, var(--badge-max));
            line-height: 1.35;
            cursor: pointer;
        }

        /* Beide Formen bemessen: vor /icons.js ein <i>, danach ein <svg>. */
        .badge i, .badge svg {
            flex: 0 0 auto;
            font-size: 1em;
            height: 1em;
            width: auto;
        }

        /* Eingefahren zeigt das Kennzeichen nur das Symbol. Der Text bleibt im
           Baum stehen (Vorlesewerkzeuge sollen ihn finden) und faehrt seitlich
           aus. Kein display: none, sonst gaebe es nichts zu bewegen. */
        .badge-text {
            max-width: 0;
            margin-left: 0;
            opacity: 0;
            white-space: nowrap;
            overflow: hidden;
            transition: max-width 0.25s ease, margin-left 0.25s ease, opacity 0.2s ease;
        }

        .badge.open .badge-text {
            max-width: 7em;
            margin-left: 0.35em;
            opacity: 1;
        }

        /* Nur mit echtem Zeigegeraet: auf dem Touchscreen bliebe :hover kleben. */
        @media (hover: hover) {
            .badge:hover .badge-text {
                max-width: 7em;
                margin-left: 0.35em;
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .badge-text { transition: none; }
        }

        .image-wrapper:disabled { cursor: default; }

        .name {
            text-align: center;
            font-size: var(--name-font-size, 10px);
            width: 100%; /* Stellt sicher, dass die Zentrierung über die volle Breite erfolgt */
            line-height: 1.2;
            /* word-break: break-word; removed as nowrap is used for ellipsis */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info {
            text-align: center;
            font-size: var(--info-font-size, 8px);
            opacity: 0.5;
            width: 100%; /* Stellt sicher, dass die Zentrierung über die volle Breite erfolgt */
            line-height: 1.2;
            /* word-break: break-word; removed as nowrap is used for ellipsis */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Gemeinsame Stile für .color und .grey */
        .color,
        .grey {
            max-width: 100%; /* Stellt sicher, dass das Bild nicht breiter als der Wrapper ist */
            max-height: 100%; /* Stellt sicher, dass das Bild nicht höher als der Wrapper ist */
            object-fit: contain; /* Zeigt das gesamte Bild, behält Seitenverhältnis bei und zentriert es innerhalb seiner Box */
            border-radius: var(--corner-radius, 50%);
        }

        .color {
            filter: grayscale(0%);
        }

        .grey {
            filter: grayscale(var(--absent-grayscale, 100%));
            opacity: var(--absent-opacity, 0.5);
        }
    </style>

    <script>
        /* Systemraender aus der Kachel-Adresse uebernehmen, so frueh wie
           moeglich — die Variablen muessen vor dem ersten Zeichnen stehen.
           Unten steht nichts an, marginbottom bleibt deshalb unbeachtet. */
        (function systemRaender() {
            try {
                const p = new URLSearchParams(window.location.search);
                const px = (name) => {
                    const v = parseInt(p.get(name), 10);
                    return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
                };
                const wurzel = document.documentElement.style;
                const mt = px('margintop');  if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
                const ms = px('marginside'); if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
            } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
        })();
    </script>

    <script src="/icons.js"></script>
</head>

<body>

    <script>
        /* Die Bewohnerplaetze entstehen zur Laufzeit aus der Nachricht. Die Zahl
           der Bewohner steht in der Konfiguration und kann sich jederzeit
           aendern; eine offene Kachel folgt ihr ohne Neuladen. */
        const slots = [];
        const MAX_SLOTS = 200;

        function createSlot(i, container) {
            const root = document.createElement('div');
            root.className = 'bewohner_div hidden';
            root.id = 'Bewohner' + i;

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'image-wrapper';
            button.id = 'button' + i;
            button.disabled = true;
            button.setAttribute('aria-pressed', 'false');
            button.setAttribute('aria-describedby', 'info' + i);
            button.onclick = function () { requestAction('Bewohner' + i, 1); };

            const image = document.createElement('img');
            image.className = 'color';
            image.id = 'image' + i;
            image.setAttribute('alt', '');
            button.appendChild(image);

            const photo = document.createElement('div');
            photo.className = 'photo';
            const badge = document.createElement('span');
            badge.className = 'badge hidden';
            badge.id = 'distance' + i;
            const badgeIcon = document.createElement('i');
            badgeIcon.className = 'fa-light fa-route';
            const badgeText = document.createElement('span');
            badgeText.className = 'badge-text';
            badge.appendChild(badgeIcon);
            badge.appendChild(badgeText);
            /* Auf dem Touchscreen gibt es kein :hover — ein Tipp auf das
               Kennzeichen fuehrt es aus. Es liegt neben dem Foto-Button, nicht
               darin, der Tipp schaltet den Bewohner also nicht. */
            badge.onclick = function () {
                const offen = badge.classList.toggle('open');
                clearTimeout(badge.timer);
                if (offen) badge.timer = setTimeout(function () { badge.classList.toggle('open', false); }, 3000);
            };
            photo.appendChild(button);
            photo.appendChild(badge);

            const name = document.createElement('div');
            name.className = 'name hidden';
            name.id = 'name' + i;

            const info = document.createElement('div');
            info.className = 'info hidden';
            info.id = 'info' + i;

            root.appendChild(photo);
            root.appendChild(name);
            root.appendChild(info);
            container.appendChild(root);
            return { root: root, button: button, image: image, name: name, info: info, badge: badge, badgeText: badgeText };
        }

        function ensureSlots(count) {
            const container = document.getElementById('container');
            while (slots.length > count) { container.removeChild(slots.pop().root); }
            while (slots.length < count) { slots.push(createSlot(slots.length + 1, container)); }
        }

        function handleMessage(data) {
            let update;
            try {
                update = JSON.parse(data);
            } catch (error) {
                console.warn('Invalid resident tile update', error);
                return;
            }
            if (!update || typeof update !== 'object' || Array.isArray(update)) return;
            const root = document.documentElement;
            const variables = {
                fontsize: ['--name-font-size', 'px'],
                infontsize: ['--info-font-size', 'px'],
                eckenradius: ['--corner-radius', '%'],
                imageMaxWidth: ['--image-max-width', '%'],
                bildtransparenz: ['--bildtransparenz', ''],
                graustufen: ['--absent-grayscale', '%'],
                abwesenheitstransparenz: ['--absent-opacity', ''],
                kachelhintergrundfarbe: ['--hintergrundfarbe', '']
            };
            for (const [key, [property, unit]] of Object.entries(variables)) {
                if (Object.prototype.hasOwnProperty.call(update, key)) root.style.setProperty(property, update[key] + unit);
            }
            if (Object.prototype.hasOwnProperty.call(update, 'bgimage')) {
                document.body.style.setProperty('--background-image', update.bgimage ? 'url(' + update.bgimage + ')' : 'none');
            }
            if (Object.prototype.hasOwnProperty.call(update, 'residents')) {
                const count = Number(update.residents);
                if (Number.isFinite(count) && count >= 0) ensureSlots(Math.min(Math.floor(count), MAX_SLOTS));
            }
            for (let i = 1; i <= slots.length; i++) {
                const slot = slots[i - 1];
                const resident = slot.root, name = slot.name, info = slot.info, image = slot.image, button = slot.button, badge = slot.badge;
                if (Object.prototype.hasOwnProperty.call(update, 'Bewohner' + i)) resident.classList.toggle('hidden', !update['Bewohner' + i]);
                if (Object.prototype.hasOwnProperty.call(update, 'nameswitch')) name.classList.toggle('hidden', !update.nameswitch);
                if (Object.prototype.hasOwnProperty.call(update, 'name' + i)) {
                    name.textContent = update['name' + i];
                    button.setAttribute('aria-label', update['name' + i]);
                }
                if (Object.prototype.hasOwnProperty.call(update, 'info' + i)) {
                    info.textContent = update['info' + i];
                    info.classList.toggle('hidden', update['info' + i] === '');
                }
                if (Object.prototype.hasOwnProperty.call(update, 'distance' + i)) {
                    // Nur den Textteil setzen, sonst faellt das Symbol wieder heraus.
                    slot.badgeText.textContent = update['distance' + i];
                    badge.classList.toggle('hidden', update['distance' + i] === '');
                }
                if (Object.prototype.hasOwnProperty.call(update, 'image' + i)) {
                    if (update['image' + i]) image.src = update['image' + i];
                    else image.removeAttribute('src');
                }
                if (Object.prototype.hasOwnProperty.call(update, 'value' + i)) {
                    const present = !!update['value' + i];
                    image.classList.toggle('color', present);
                    image.classList.toggle('grey', !present);
                    button.setAttribute('aria-pressed', String(present));
                }
                if (Object.prototype.hasOwnProperty.call(update, 'operable' + i)) button.disabled = !update['operable' + i];
            }
        }
    </script>

    <div class="container_anwesenheit" id="container"></div>

</body>

</html>
